server {
    listen 80;
    server_name localhost;

    # Ocultar versión de Nginx (Seguridad básica)
    server_tokens off;

    # =================================================================
    # SECURITY HEADERS
    # =================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Limitar tamaño de request body (10MB)
    client_max_body_size 10m;

    # Timeouts
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # =================================================================
    # BLOQUEO DE SEGURIDAD (Lo primero es cerrar puertas)
    # =================================================================
    # Evita que descarguen tu .env, .git, etc.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # =================================================================
    # TODO → BACKEND (Laravel sirve landing, app, API, assets)
    # =================================================================
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
