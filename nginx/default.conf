server {
    listen 80;
    server_name localhost;
    
    # Raíz del Backend (Laravel)
    root /var/www/html/public;
    index index.php index.html;
    include /etc/nginx/mime.types;

    # =========================================================
    # 1. LANDING PAGE (RAÍZ) -> AL FRONTEND
    # =========================================================
    location = / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Forzamos a Nginx a enviar estas rutas al puerto 8000

    # =========================================================
    # 2. RECURSOS DEL FRONTEND (CSS, JS, IMÁGENES)
    # =========================================================
    # Cualquier cosa que empiece por /src/ se va al contenedor frontend
    location ^~ /src/ {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
    }
    
    # Cualquier cosa de node_modules (si lo usas)
    location ^~ /node_modules/ {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
    }
    
    # Soporte para Vite HMR (Recarga en caliente)
    location /@vite/ {
        proxy_pass http://frontend:5173;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

# --- EL CAMBIO CLAVE AQUÍ ---
    # No uses proxy_pass directo. Usa try_files para que Nginx procese la URL
    # y luego se la pase al bloque PHP de abajo correctamente.
    
    location /login {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /register {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    
    location /dashboard {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;    
    }
    
    location /setup {
        # Apunta al archivo HTML de tu guia paso a paso
        proxy_pass http://frontend:5173/src/html/setup.html; 
        proxy_set_header Host $host;
    }
#     # =========================================================
    # 3. TODO LO DEMÁS -> A LARAVEL (BACKEND)
    # =========================================================

}  