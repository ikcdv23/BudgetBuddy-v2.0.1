services:
  # --- SERVICIO 1: NGINX (El único que da la cara) ---
  nginx:
    image: nginx:alpine
    container_name: budgetbuddy-nginx
    restart: unless-stopped
    ports:
      - "80:80" # ÚNICO PUERTO ABIERTO AL MUNDO
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - budgetbuddy_net

  # --- SERVICIO 2: BACKEND (Oculto en la red interna) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budgetbuddy-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    expose:
      - "8000"
    depends_on:
      - db
    networks:
      - budgetbuddy_net

  # --- SERVICIO 3: BASE DE DATOS ---
  db:
    image: mysql:8.0
    container_name: budgetbuddy-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-budgetbuddy}
      MYSQL_USER: ${MYSQL_USER:-budgetbuddy_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_app}
    networks:
      - budgetbuddy_net

  # --- SERVICIO 4: PHPMYADMIN (Solo desarrollo local - NO exponer en produccion) ---
  # SEGURIDAD: Restringido a localhost unicamente
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: budgetbuddy-pma
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80" # Solo accesible desde localhost
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
    depends_on:
      - db
    networks:
      - budgetbuddy_net
networks:
  budgetbuddy_net:
    driver: bridge
